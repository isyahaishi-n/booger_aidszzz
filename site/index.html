<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Zenless Zone Zero agent showcase viewer with full stat calculation — powered by enka.network data">
<meta name="theme-color" content="#0b0b10">
<title>ZZZ Agent Showcase</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0b10'/%3E%3Cpath d='M6 6h20v6H12v2h12v6H12v2h14v6H6z' fill='%23ffd24d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-tape">ZZZ</span>
    <h1>Agent Showcase</h1>
  </div>
  <form id="uid-form" class="uid-form" autocomplete="off">
    <input id="uid-input" inputmode="numeric" maxlength="12" placeholder="Enter UID…">
    <button type="submit" class="btn">Load</button>
    <button type="button" id="btn-sample" class="btn btn-ghost">Sample</button>
  </form>
</header>

<main>
  <div id="status" class="status hidden"></div>
  <section id="player" class="hidden"></section>
  <section id="chars" class="char-grid"></section>
</main>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div id="modal" class="modal"></div>
</div>

<footer class="footer">
  Data via enka.network · fan-made tool, not affiliated with HoYoverse
</footer>

<script src="/static/app.js"></script>
</body>
</html>
